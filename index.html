const $=id=>document.getElementById(id);const scene=$('scene'),wezi=$('wezi'),speech=$('speech'),dark=$('dark');$('face').src=WEZI_IMAGE;
const state={room:'living',hunger:78,hygiene:74,energy:86,fun:88,coins:250,xp:0,level:1,stage:1,voice:1.15,sleeping:false};
const rooms={living:['🏠 Living Room','living'],kitchen:['🍳 Kitchen','kitchen'],bath:['🚿 Bathroom','bath'],bed:['🛏️ Bedroom','bed'],yard:['🌳 Yard','yard']};
function render(){['hunger','hygiene','energy','fun'].forEach(k=>$(k).style.width=state[k]+'%');$('coins').textContent=state.coins;$('xp').textContent=state.xp;$('level').textContent=state.level;$('stage').textContent=state.stage}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function bubble(t,ms=2600){speech.textContent=t;speech.classList.add('speechOn');clearTimeout(bubble.t);bubble.t=setTimeout(()=>speech.classList.remove('speechOn'),ms)}
function say(t){bubble(t);if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=state.voice;u.rate=.88;u.volume=1;u.onstart=()=>wezi.classList.add('talking');u.onend=()=>wezi.classList.remove('talking');speechSynthesis.speak(u)}
function fx(emoji,cls='particle'){let e=document.createElement('div');e.className=cls;e.textContent=emoji;e.style.left=(42+Math.random()*16)+'%';e.style.top=(30+Math.random()*20)+'%';scene.appendChild(e);setTimeout(()=>e.remove(),1100)}
function reward(n){state.xp+=n;state.coins+=Math.max(1,Math.floor(n/2));if(state.xp>=100){state.xp-=100;state.level++;if(state.level%3===0&&state.stage<9){state.stage++;state.voice=Math.max(1.05,state.voice-.02);toast('🎉 Growth! Wezi reached Stage '+state.stage)}else toast('⭐ Level '+state.level+'!')}render();save()}
function animate(cls,ms){wezi.classList.remove('walkL','walkR','eatAnim','washAnim','sleepAnim','jump','dizzy','danceAnim');void wezi.offsetWidth;wezi.classList.add(cls);if(ms)setTimeout(()=>wezi.classList.remove(cls),ms)}
function goRoom(r){state.room=r;const [title,cl]=rooms[r];scene.className=cl;$('roomTitle').textContent=title;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.room===r));buildRoom(r);if(r==='living')say('Back in the living room!');if(r==='kitchen')say('Let’s get something to eat!');if(r==='bath')say('Bathroom time!');if(r==='bed')say('Bedroom time.');if(r==='yard')say('Let’s go outside!');save()}
function buildRoom(r){const o=$('roomObjects');o.innerHTML='';if(r==='kitchen'){o.innerHTML='<div class="counter"></div><div class="fridge"></div><div class="table"></div><div class="chair ch1"></div><div class="chair ch2"></div>'}if(r==='bath'){o.innerHTML='<div class="tub"></div><div class="toilet"></div><div class="sink">🚰</div>'}if(r==='bed'){o.innerHTML='<div class="bed"><div class="pillow"></div></div><div class="lamp">💡</div>'}if(r==='yard'){o.innerHTML='<div class="tree">🌳</div><div class="yardItem trampoline">🤸</div><div class="yardItem plane">✈️</div><div class="cloud c1"></div>'}}
function eat(item){goRoom('kitchen');setTimeout(()=>{animate('walkL',500);setTimeout(()=>{animate('eatAnim',3000);fx(item==='🌶️'?'🔥':'🍽️');if(item==='🌶️'){say('AAAAH! Too spicy! 🔥');state.hunger=Math.min(100,state.hunger+8);state.fun=Math.max(0,state.fun-3);fx('🔥','fire')}else if(item==='🍦'){say('Brrr! Brain freeze! 🥶');state.hunger=Math.min(100,state.hunger+12);state.fun=Math.min(100,state.fun+4);fx('🥶')}else if(item==='🥦'){say('Nooo! I don’t like that!');state.fun=Math.max(0,state.fun-2);fx('😖')}else{say('Yummm! That was delicious!');state.hunger=Math.min(100,state.hunger+24);state.fun=Math.min(100,state.fun+5);fx('❤️')}reward(8);render()},500)},400)}
function feed(){eat(['🍎','🥛','🍔','🍦'][Math.floor(Math.random()*4)])}
function bath(){goRoom('bath');setTimeout(()=>{animate('washAnim',2600);for(let i=0;i<4;i++)setTimeout(()=>fx('🫧','foam'),i*400);say('Soap... scrub... rinse!');state.hygiene=100;state.fun=Math.min(100,state.fun+5);reward(8);render()},600)}
function toilet(){goRoom('bath');setTimeout(()=>{say('Ahhh... much better!');state.hygiene=100;state.fun=Math.min(100,state.fun+4);reward(6);render()},700)}
function sleep(){goRoom('bed');state.sleeping=true;dark.classList.add('darkOn');wezi.classList.add('sleepAnim');let z=document.createElement('div');z.className='sleepZ';z.textContent='Zzz';scene.appendChild(z);say('Good night... zzz');let ticks=0;const timer=setInterval(()=>{state.energy=Math.min(100,state.energy+8);ticks++;render();if(ticks>=8){clearInterval(timer);wake(z)}},1000)}
function wake(z){state.sleeping=false;dark.classList.remove('darkOn');wezi.classList.remove('sleepAnim');z.remove();say('Good morning! I’m awake! ☀️');reward(8)}
function dance(){openDance()}
function openDance(){goRoom('living');let p=document.createElement('div');p.id='dancePanel';p.className='panel open';p.innerHTML='<div class="card"><button class="close">×</button><h2>💃 Wezi Dance Arena</h2><div class="danceRoom"><div class="spot sp1"></div><div class="spot sp2"></div><div class="miniWe" id="miniWe"><div class="head"><img class="face" src="'+WEZI_IMAGE+'"><div class="mouth"></div></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe sh1"></div><div class="shoe sh2"></div></div></div><p style="text-align:center;font-weight:900">Wezi is dancing! Tap the arena for a new move.</p></div>';p.querySelector('.close').onclick=()=>p.remove();p.querySelector('.danceRoom').onclick=()=>{let w=p.querySelector('#miniWe');w.classList.toggle('danceAnim');state.fun=Math.min(100,state.fun+10);reward(4)};document.getElementById('game').appendChild(p);p.querySelector('#miniWe').classList.add('danceAnim')}
function openPanel(title,html){$('panelTitle').textContent=title;$('panelContent').innerHTML=html;$('panel').classList.add('open')}
function closePanel(){$('panel').classList.remove('open')}
function kitchenMenu(){openPanel('🍳 Kitchen','<div class="grid">'+[['🍎','Apple'],['🥛','Milk'],['🍔','Burger'],['🍦','Ice Cream'],['🌶️','Chili'],['🥦','Disliked Food']].map(x=>'<button class="item" data-food="'+x[0]+'"><b>'+x[0]+'</b>'+x[1]+'</button>').join('')+'</div>');document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{closePanel();eat(b.dataset.food)})}
function bathMenu(){openPanel('🚿 Bathroom','<div class="grid"><button class="item" id="soap"><b>🧼</b>Soap</button><button class="item" id="toilet"><b>🚽</b>Toilet</button><button class="item" id="shower"><b>🚿</b>Shower</button></div>');$('soap').onclick=()=>{closePanel();bath()};$('shower').onclick=()=>{closePanel();bath()};$('toilet').onclick=()=>{closePanel();toilet()}}
function bedMenu(){openPanel('🛏️ Bedroom','<div class="grid"><button class="item" id="bedSleep"><b>😴</b>Sleep</button><button class="item" id="lamp"><b>💡</b>Toggle Lamp</button><button class="item" id="ward"><b>👕</b>Wardrobe</button></div>');$('bedSleep').onclick=()=>{closePanel();sleep()};$('lamp').onclick=()=>{closePanel();sleep()};$('ward').onclick=()=>{closePanel();wardrobe()}}
function wardrobe(){openPanel('👕 Wardrobe','<div class="grid"><button class="item" data-out="blue"><b>👕</b>Blue</button><button class="item" data-out="red"><b>🧥</b>Red</button><button class="item" data-out="green"><b>🥼</b>Green</button><button class="item" data-out="hat"><b>🧢</b>Hat</button></div>');document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{let x=b.dataset.out;let body=wezi.querySelector('.body');body.style.background=x==='red'?'linear-gradient(145deg,#ff6b6b,#a83245)':x==='green'?'linear-gradient(145deg,#57d38c,#208457)':'linear-gradient(145deg,#775cf0,#3e329e)';closePanel();say('Looking good!');reward(3)})}
function arcade(){openPanel('🎮 Mini-Game Arcade','<div class="grid"><button class="item" id="catch"><b>⭐</b>Star Catch</button><button class="item" id="runner"><b>🏃</b>Wezi Run</button><button class="item" id="memory"><b>🧠</b>Memory</button></div>');$('catch').onclick=()=>{closePanel();starGame()};$('runner').onclick=()=>{closePanel();runnerGame()};$('memory').onclick=()=>{closePanel();memoryGame()}}
function starGame(){let n=0;openPanel('⭐ Star Catch','<div id="arc" class="arcade"></div><h3 style="text-align:center">Score: <span id="sc">0</span></h3>');let arc=$('arc');let timer=setInterval(()=>{let b=document.createElement('button');b.className='target';b.textContent=Math.random()>.2?'⭐':'🪙';b.style.left=(5+Math.random()*85)+'%';b.style.top=(5+Math.random()*80)+'%';b.onclick=()=>{n++;$('sc').textContent=n;b.remove()};arc.appendChild(b);setTimeout(()=>b.remove(),900)},650);setTimeout(()=>{clearInterval(timer);closePanel();state.coins+=n*3;state.fun=Math.min(100,state.fun+15);say('Game over! +'+n*3+' coins');reward(10);render()},12000)}
function runnerGame(){openPanel('🏃 Wezi Run','<div class="arcade"><div class="runner">🧑</div><div class="obstacle">🪨</div></div><h3 style="text-align:center">Tap to jump!</h3>');let a=$('panelContent');a.onclick=()=>{wezi.classList.add('jump');setTimeout(()=>wezi.classList.remove('jump'),500);state.fun=Math.min(100,state.fun+3);reward(1)}}
function memoryGame(){let arr=['🍎','🍕','🍔','🍦','🍎','🍕','🍔','🍦'].sort(()=>Math.random()-.5),first=null,lock=false,matched=0;openPanel('🧠 Memory','<div class="grid">'+arr.map((x,i)=>'<button class="item mem" data-i="'+i+'"><b>❓</b></button>').join('')+'</div>');let bs=document.querySelectorAll('.mem');bs.forEach((b,i)=>b.onclick=()=>{if(lock||b.dataset.done)return;b.querySelector('b').textContent=arr[i];if(!first){first=b;return}if(first.querySelector('b').textContent===b.querySelector('b').textContent){first.dataset.done='1';b.dataset.done='1';first=null;matched++;if(matched===4){state.coins+=25;state.fun=Math.min(100,state.fun+20);toast('🏆 Memory complete! +25 coins');reward(12);setTimeout(closePanel,700)}}else{lock=true;setTimeout(()=>{first.querySelector('b').textContent='❓';b.querySelector('b').textContent='❓';first=null;lock=false},600)}})}
/* voice recognition: browser-safe fallback; true pitch shifting requires WebAudio and recorded audio support. */
let rec=null,listening=false;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){rec=new R();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{listening=true;$('mic').classList.add('listen');bubble('Listening...')};rec.onresult=e=>{let t=e.results[0][0].transcript.trim();if(t){state.fun=Math.min(100,state.fun+6);reward(5);say(t)}};rec.onerror=()=>toast('🎙️ Allow microphone permission');rec.onend=()=>{listening=false;$('mic').classList.remove('listen')}}$('mic').onclick=()=>{if(!rec)return toast('Use Chrome on HTTPS/GitHub Pages for the microphone');try{listening?rec.stop():rec.start()}catch(e){toast('Allow microphone permission')}};
/* touch reactions */
let start=null;wezi.addEventListener('pointerdown',e=>{if(state.sleeping){wake(document.querySelector('.sleepZ'));return}start={x:e.clientX,y:e.clientY};wezi.classList.add('jump')});wezi.addEventListener('pointerup',e=>{wezi.classList.remove('jump');if(!start)return;let dy=e.clientY-start.y,dx=e.clientX-start.x;if(Math.abs(dy)+Math.abs(dx)>65){if(dy>0){say('Aww, that tickles!');state.fun=Math.min(100,state.fun+9)}else{say('Wheee!');state.fun=Math.min(100,state.fun+7)}reward(3)}else{say('Hehe!');state.fun=Math.min(100,state.fun+4);reward(2)}render();start=null});
/* action buttons */
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==='talk')say('Hey! I am Wezi!');if(a==='feed')feed();if(a==='bath')bath();if(a==='sleep')sleep();if(a==='dance')dance();render()});
/* room tabs */
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=b.dataset.room;goRoom(r);if(r==='kitchen')kitchenMenu();if(r==='bath')bathMenu();if(r==='bed')bedMenu();if(r==='yard')say('Welcome to the yard! Tap DANCE or PLAY from Home.')});
/* periodic needs + save */
function save(){try{localStorage.setItem('talkingWezi2',JSON.stringify(state))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem('talkingWezi2'));if(s)Object.assign(state,s)}catch(e){}}load();render();buildRoom('living');setInterval(()=>{if(!state.sleeping){state.hunger=Math.max(0,state.hunger-.10);state.hygiene=Math.max(0,state.hygiene-.07);state.energy=Math.max(0,state.energy-.08);state.fun=Math.max(0,state.fun-.06)}render();save()},3000);setTimeout(()=>say('Welcome to Talking Wezi 2!'),700);
</script></div></body></html>
